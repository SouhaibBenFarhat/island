# Release Drafter config — PR-based changelog driven by Conventional Commit PR titles.
# The autolabeler applies labels from the PR title; categories group by those labels;
# version-resolver computes the next semver bump from them. PRs whose titles don't
# match any pattern still appear in the draft, just uncategorized.

name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

# One changelog line per merged PR: title, PR number, author.
change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
change-title-escapes: '\<*_&'

categories:
  - title: '🚀 Features'
    labels: [feature]
  - title: '🐛 Fixes'
    labels: [fix]
  - title: '🧹 Maintenance'
    labels: [maintenance]

# feat → minor, fix/chore/etc → patch, anything breaking (`!` or BREAKING CHANGE) → major.
version-resolver:
  major:
    labels: [breaking]
  minor:
    labels: [feature]
  patch:
    labels: [fix, maintenance]
  default: patch

# Apply labels automatically from Conventional-Commit-style PR titles.
autolabeler:
  - label: feature
    title: '/^feat(\(.+\))?!?:/i'
  - label: fix
    title: '/^fix(\(.+\))?!?:/i'
  - label: maintenance
    title: '/^(chore|ci|build|docs|refactor|perf|test|style|revert)(\(.+\))?!?:/i'
  - label: breaking
    title: '/^[a-z]+(\(.+\))?!:/i'
  - label: breaking
    body: '/BREAKING CHANGE/'

template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/SouhaibBenFarhat/island/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

  ---
  ### 📦 Install (macOS, Apple Silicon)

  ```
  brew install --cask souhaibbenfarhat/tap/island   # first install
  brew upgrade --cask island                        # upgrade
  ```

  Island needs Accessibility permission (System Settings → Privacy & Security →
  Accessibility) to put text into other apps.

  Installing manually from the attached `Island-arm64.zip` instead? Clear
  Gatekeeper's quarantine flag once: `xattr -dr com.apple.quarantine /Applications/Island.app`
